<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff1d2">
<title>施彦成，生日快乐！</title>
<style>
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 30px 18px; background-color: #e9e2d2;
background-image: radial-gradient(#c8bea9 0.7px, transparent 0.8px); background-size: 6px 6px;
color: #4d302e; font: 16px/1.65 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
#yancheng-birthday { --font-size-base: 16px; width: min(100%, 740px); background: #fffaee; padding: clamp(16px, 4vw, 32px); border: 1px solid #a99a81; box-shadow: 4px 5px 0 #d4c7b1; }
.birthday-poster { border: 1px solid #b47560; }
.birthday-note { padding: 1px 0 0; }
h2, p { margin: 0; }
h2 { font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif; font-weight: 800; font-size: clamp(27px, 5vw, 43px); line-height: 1.16; color: #8d3443; }
.text-small { font: 600 12px/1.6 "Courier New", monospace; color: #765b50; letter-spacing: .14em; }
.viz-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { font: inherit; font-weight: 650; cursor: pointer; line-height: 1.35; padding: 12px 18px; min-height: 44px; color: #783341; background: #fff6df; border: 1.5px solid #a95661; box-shadow: 2px 3px 0 #e5c7b1; }
.btn-primary { background: #a43749; border-color: #863646; color: #fff9e9; }
.btn:active { transform: translate(1px,2px); box-shadow: none; }
.btn:focus-visible { outline: 3px solid #497b81; outline-offset: 4px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
</style>
</head>
<body>
<section id="yancheng-birthday" aria-label="送给施彦成的生日贺卡">
  <style>
    #yancheng-birthday .birthday-poster { position: relative; isolation: isolate; }
    #yancheng-birthday canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    #yancheng-birthday .paper-pieces { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #yancheng-birthday .paper-pieces i { position: absolute; }
    #yancheng-birthday .birthday-note { display: grid; gap: calc(var(--font-size-base, 16px) * .55); }
    #yancheng-birthday .birthday-actions { margin-block-start: var(--font-size-base, 16px); }
    #yancheng-birthday .birthday-poster { margin-block-end: var(--font-size-base, 16px); }
  </style>
  <div class="birthday-poster">
    <canvas width="320" height="140" role="img" aria-label="像素贺卡上写着 Happy Birthday，草莓蛋糕上的蜡烛正亮着。"></canvas>
    <div class="paper-pieces" aria-hidden="true"></div>
  </div>
  <div class="birthday-note">
    <time class="text-small text-muted" datetime="2026-11-13">2026 · 11 · 13</time>
    <h2>施彦成，生日快乐！</h2>
    <div aria-live="polite" aria-atomic="true"><p data-note>先闭上眼睛，悄悄许个愿。许好了，就吹蜡烛吧。</p></div>
  </div>
  <div class="birthday-actions viz-row">
    <button class="btn btn-primary" type="button" data-candle>吹蜡烛</button>
    <button class="btn" type="button" data-song>♫ 播放生日歌</button>
  </div>
  <span class="sr-only" role="status" data-status></span>
</section>
<script>
(() => {
  'use strict';
  const root = document.getElementById('yancheng-birthday');
  const poster = root.querySelector('canvas');
  const ctx = poster.getContext('2d');
  const candle = root.querySelector('[data-candle]');
  const song = root.querySelector('[data-song]');
  const note = root.querySelector('[data-note]');
  const status = root.querySelector('[data-status]');
  const paper = root.querySelector('.paper-pieces');
  const cake = document.createElement('canvas');
  cake.width = 160;
  cake.height = 112;
  const cakeCtx = cake.getContext('2d');
  let lit = true;
function drawBirthdayCake(ctx, lit) {
  const ink = '#573744', crust = '#b87668', cream = '#fff5d9';
  const ivory = '#fffbed', rose = '#f7a397', berry = '#df5462';
  const glass = '#a4d5d9', glassInk = '#527987';
  const rect = (x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  };
  // Sample each column on a two-pixel grid. Even the curved edges have square pixels.
  const columns = (left, width, rise, paint) => {
    for (let offset = 0; offset < width; offset += 2) {
      const u = (offset + 1) / width * 2 - 1;
      paint(left + offset, Math.round(rise * Math.sqrt(1 - u * u) / 2) * 2);
    }
  };
  const stamp = (x, y, rows, palette) => {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        if (palette[row[i]]) rect(x + i, y + j, 1, 1, palette[row[i]]);
      }
    });
  };
  const strawberry = [
    '      gg  g    ',
    '   gg ggggg    ',
    '   gGGGGGg     ',
    '   kkGGGGGgk   ',
    '  krrGGGrrrrk  ',
    ' krhhrrrhrssrk ',
    ' krhhrrrrrrsrk ',
    ' krrrsrrrsrsrk ',
    ' krrhrrrrrrsck ',
    '  krrrrhrrsck  ',
    '  krsrrrrrsck  ',
    '   krrrsrsck   ',
    '    krrrsck    ',
    '     krcck     ',
    '      kkk      '
  ];
  const fruitColors = {
    k: ink, G: '#5d896d', g: '#365e56', r: berry, h: '#ffc6ac',
    s: '#ffdd9a', c: '#ba4659'
  };
  const rosette = [
    '     kk   ', '    kwwk  ', '   kwiwk  ', '  kwiwpwk ',
    ' kwiwwiwwk', ' kwwiwwppk', '  kpppppk ', '   kkkkk  '
  ];
  const piping = {k:'#cb9288', w:cream, i:ivory, p:'#f2c5ac'};

  ctx.save();
  ctx.clearRect(0, 0, 160, 112);

  // Foot, stem and scalloped glass platter, in depth order.
  columns(56, 48, 4, (x, lift) => {
    rect(x, 104 - lift, 2, 2 * lift + 3, glassInk);
    rect(x, 104 - lift, 2, 2 * lift, glass);
  });
  rect(68, 104, 24, 2, '#dff0e7');
  rect(73, 90, 14, 12, glassInk);
  rect(75, 91, 10, 11, glass);
  rect(76, 91, 3, 11, '#e3f6eb');
  rect(71, 99, 18, 3, glassInk);
  rect(73, 99, 14, 4, glass);
  columns(14, 132, 9, (x, lift) => {
    rect(x, 85 - lift, 2, 2 * lift + 5, glassInk);
    rect(x, 85 - lift, 2, 2 * lift + 3, glass);
    rect(x, 85 - lift, 2, 2 * lift + 1, '#dbede3');
    rect(x, 85 + lift, 2, 1, '#f5f6da');
  });

  const top = 46, depth = 32;
  const frontAt = x => {
    const u = (x - 80) / 56;
    return top + 2 * Math.round(5 * Math.sqrt(Math.max(0, 1 - u * u)));
  };
  // Sponge, strawberry conserve and cream follow the curve of the cut face.
  columns(24, 112, 10, (x, lift) => {
    const y = top + lift;
    rect(x, top - lift, 2, 2 * lift + depth, ink);
    if (x === 24 || x === 134) return;
    rect(x, y, 2, depth - 2, '#f0c28f');
    rect(x, y + 10, 2, 3, '#e5aa80');
    rect(x, y + 13, 2, 3, cream);
    rect(x, y + 16, 2, 4, berry);
    rect(x, y + 20, 2, 2, '#ad525c');
    rect(x, y + 22, 2, 3, '#ffe3b9');
    rect(x, y + 28, 2, 2, crust);
    rect(x, top - lift + 2, 2, 2 * lift + 3, cream);
  });
  // Each scallop has an offset shadow and square-ended drip.
  for (let x = 26; x < 134; x += 2) {
    const y = frontAt(x + 1);
    const ripple = [2, 3, 5, 6, 6, 4, 2, 1][((x - 26) / 2) % 8];
    rect(x, y - 1, 2, ripple + 3, '#cb8d81');
    rect(x, y - 1, 2, ripple + 1, '#f7d0b5');
    rect(x, y - 2, 2, ripple, ivory);
  }
  for (const [x, dy, color] of [
    [34,11,crust],[46,9,'#ffe5af'],[55,11,crust],[69,10,'#ffe5af'],
    [89,11,crust],[103,9,'#ffe5af'],[118,10,crust],[127,10,'#ffe5af'],
    [39,25,crust],[50,25,'#ffe5af'],[65,26,crust],[79,25,'#ffe5af'],
    [96,26,crust],[108,25,'#ffe5af'],[123,26,crust]
  ]) rect(x, frontAt(x) + dy, 2, 1, color);
  for (const x of [34, 49, 61, 85, 97, 111, 127]) {
    rect(x, frontAt(x) + 16, 4, 2, rose);
  }

  stamp(35, 31, strawberry, fruitColors);
  stamp(49, 35, rosette, piping);
  stamp(60, 30, strawberry, fruitColors);
  stamp(94, 32, rosette, piping);
  stamp(109, 31, strawberry, fruitColors);
  // Coral and cream barber-pole candle; the wick stays visible in both states.
  rect(75, 41, 13, 4, '#e9bcaa');
  rect(76, 21, 9, 23, ink);
  rect(77, 23, 7, 19, '#ffead3');
  for (const y of [25, 32, 39]) {
    rect(77, y + 1, 3, 2, berry);
    rect(80, y - 1, 2, 3, berry);
    rect(82, y - 2, 2, 2, berry);
  }
  rect(77, 22, 7, 1, rose);
  rect(80, 17, 2, 5, ink);
  if (lit) {
    stamp(76, 4, [
      '      oo  ', '     oo   ', '    ooo   ', '    oYoo  ',
      '   oYYooo ', '  ooYYYOo ', '  oYYYYOOo', ' oYYYYYOOo',
      ' oYYWWYOOo', ' oYWWWYOOo', '  oWWWYOo ', '  ooYOOOo ',
      '   oOOoo  ', '    oo    '
    ], {o:'#dc7454', O:'#f69b58', Y:'#ffd375', W:'#fff6c6'});
  } else {
    rect(80, 16, 2, 1, berry);
    rect(82, 12, 2, 3, '#baa5a1');
    rect(80, 10, 3, 2, '#baa5a1');
    rect(78, 7, 3, 3, '#d6beba');
    rect(80, 5, 2, 2, '#d6beba');
  }
  stamp(41, 41, rosette, piping);
  stamp(57, 39, strawberry, fruitColors);
  stamp(86, 43, rosette, piping);
  stamp(98, 39, strawberry, fruitColors);
  stamp(118, 40, rosette, piping);
  ctx.restore();
}

  const glyphs = {
    H: ['11011','11011','11011','11111','11011','11011','11011'],
    A: ['01110','11011','11011','11111','11011','11011','11011'],
    P: ['11110','11011','11011','11110','11000','11000','11000'],
    Y: ['11011','11011','01010','01110','00100','00100','00100'],
    B: ['11110','11011','11011','11110','11011','11011','11110'],
    I: ['111','010','010','010','010','010','111'],
    R: ['11110','11011','11011','11110','11100','11010','11011'],
    T: ['11111','11111','00100','00100','00100','00100','00100'],
    D: ['11110','11011','11011','11011','11011','11011','11110'],
    '!':['11','11','11','11','11','00','11']
  };
  function stamp(rows, x, y, size, color) {
    ctx.fillStyle = color;
    rows.forEach((row, dy) => [...row].forEach((bit, dx) => {
      if (bit === '1') ctx.fillRect(x + dx * size, y + dy * size, size, size);
    }));
  }
  function print(word, x, y, size, color) {
    for (const letter of word) {
      const rows = glyphs[letter];
      stamp(rows, x, y, size, color);
      x += (rows[0].length + 1) * size;
    }
  }
  const heart = ['0110110','1111111','1111111','0111110','0011100','0001000'];
  const twinkle = ['00100','00100','11111','00100','00100'];
  const diamond = ['00100','01110','11011','01110','00100'];
  function drawPoster() {
    if (!ctx || !cakeCtx) return;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#fff1d2';
    ctx.fillRect(0, 0, 320, 140);
    const cherry = '#a8394b';
    for (const y of [0,130]) {
      ctx.fillStyle = '#f6c3a8';
      ctx.fillRect(0, y, 320, 10);
      ctx.fillStyle = '#d67873';
      for (let x = 0; x < 320; x += 10) {
        ctx.fillRect(x, y, 5, 5);
        ctx.fillRect(x + 5, y + 5, 5, 5);
      }
    }
    for (const [x, y, kind, color] of [
      [12,18,twinkle,'#be776b'],[122,23,diamond,'#dda64f'],
      [164,19,twinkle,'#759b93'],[295,24,diamond,'#d98976'],
      [182,51,twinkle,'#b8885a'],[301,67,twinkle,'#88a69a'],
      [172,110,diamond,'#d8966c'],[146,102,twinkle,'#bf8c71']
    ]) stamp(kind, x, y, 1, color);
    for (const [x,y] of [[35,21],[107,32],[141,45],[189,19],[284,45],[183,88],[305,107],[114,112],[15,104]]) {
      ctx.fillStyle = '#d4ad83';
      ctx.fillRect(x, y, 2, 2);
    }
    print('HAPPY', 18, 35, 3, '#f1b499');
    print('HAPPY', 18, 33, 3, cherry);
    print('BIRTHDAY!', 18, 65, 3, '#f1b499');
    print('BIRTHDAY!', 18, 63, 3, cherry);
    stamp(heart, 19, 101, 2, cherry);
    stamp(heart, 42, 101, 2, '#db7977');
    stamp(heart, 65, 101, 2, '#e3a79a');
    drawBirthdayCake(cakeCtx, lit);
    ctx.drawImage(cake, 158, 12);
  }

  function refresh() {
    drawPoster();
    poster.setAttribute('aria-label', lit ? '像素贺卡上写着 Happy Birthday，草莓蛋糕上的蜡烛正亮着。' : '草莓蛋糕上的蜡烛已熄灭，烛芯上飘起一缕烟。');
    candle.textContent = lit ? '吹蜡烛' : '重新点亮蜡烛';
    note.textContent = lit
      ? '先闭上眼睛，悄悄许个愿。许好了，就吹蜡烛吧。'
      : '彦成，祝你新的一岁，想去的地方说走就走，想见的朋友一约就齐。今天，草莓最多的那块蛋糕归你！';
  }

  function tossConfetti() {
    paper.replaceChildren();
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) return;
    const colors = ['#b64455','#e99379','#678e88','#e6aa46'];
    const height = paper.clientHeight;
    for (let i = 0; i < 44; i++) {
      const piece = document.createElement('i');
      const length = 3 + Math.random() * 5;
      Object.assign(piece.style, {
        left: (2 + Math.random() * 96) + '%', top: '-12px',
        width: length + 'px', height: (length * 1.6) + 'px',
        backgroundColor: colors[i % colors.length]
      });
      paper.appendChild(piece);
      const drift = (Math.random() - .5) * 105;
      const spin = (Math.random() - .5) * 650;
      const animation = piece.animate([
        {transform:'translate(0, 0) rotate(0deg)'},
        {transform:'translate(' + drift + 'px,' + (height + 22) + 'px) rotate(' + spin + 'deg)'}
      ], {duration:1300 + Math.random() * 800, delay:Math.random() * 450, easing:'ease-in'});
      animation.onfinish = () => piece.remove();
    }
  }

  function restore(state) {
    if (typeof state?.privateContent?.lit !== 'boolean') return;
    lit = state.privateContent.lit;
    refresh();
  }
  refresh();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', e => restore(e.detail?.globals?.widgetState));
  candle.addEventListener('click', () => {
    lit = !lit;
    refresh();
    if (lit) paper.replaceChildren();
    else tossConfetti();
    window.openai?.setWidgetState?.({privateContent:{lit}})?.catch?.(() => {});
  });

  // The opening pickup is a dotted eighth and a sixteenth.
  const melody = [
    [67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
    [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
    [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],
    [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]
  ];
  let audioSession;
  function stopSong() {
    const session = audioSession;
    audioSession = null;
    song.textContent = '♫ 播放生日歌';
    if (session && session.state !== 'closed') session.close().catch(() => {});
  }
  song.addEventListener('click', async () => {
    if (audioSession) { stopSong(); return; }
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) { status.classList.remove('sr-only'); status.textContent = '当前浏览器不支持音乐播放。'; return; }
    let session;
    try {
      session = new Audio();
      audioSession = session;
      song.textContent = '■ 停止生日歌';
      await session.resume();
      if (session !== audioSession) return;
      status.textContent = '';
      status.classList.add('sr-only');
      let when = session.currentTime + .04;
      for (const [index, [midi, beats]] of melody.entries()) {
        const duration = beats * .43;
        const voice = session.createOscillator();
        const volume = session.createGain();
        voice.type = 'triangle';
        voice.frequency.value = 440 * 2 ** ((midi - 69) / 12);
        volume.gain.setValueAtTime(.0001, when);
        volume.gain.exponentialRampToValueAtTime(.18, when + .018);
        volume.gain.exponentialRampToValueAtTime(.0001, when + duration * .95);
        voice.connect(volume);
        volume.connect(session.destination);
        voice.start(when);
        voice.stop(when + duration);
        if (index === melody.length - 1) voice.onended = () => { if (audioSession === session) stopSong(); };
        when += duration;
      }
    } catch {
      if (session && audioSession !== session) return;
      stopSong();
      status.classList.remove('sr-only');
      status.textContent = '生日歌暂时无法播放，可以再试一次。';
    }
  });
  window.addEventListener('pagehide', stopSong);
})();
</script>
</body>
</html>
